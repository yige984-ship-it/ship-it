<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天工 · 镇天执灯人</title><style>*{box-sizing:border-box}input,textarea,button,select,label{max-width:100%}a{color:#b7dbff;overflow-wrap:anywhere}@media(max-width:600px){body{padding:16px!important}section{padding:12px!important}input:not([type=checkbox]){width:100%;margin:5px 0}label{width:100%}}body{background:#111923;color:#eee;font:16px system-ui;max-width:1080px;margin:auto;padding:28px}input,textarea,button,select{font:inherit;padding:10px;margin:5px;background:#243343;color:white;border:1px solid #526270;border-radius:6px}textarea{width:90%;height:80px}section{border:1px solid #526270;padding:18px;margin:18px 0;border-radius:12px}button{cursor:pointer}#message{white-space:pre-wrap;color:#ffd08a}label{display:inline-block}h1{color:#ecd4a0}</style><h1>天工 AI Studio · 镇天执灯人</h1><p>电影级优先 · 18镜头 × 5秒 · 首轮预算上限 ¥140</p><p>当前为制作规划与参考素材工作台，尚未生成真实 AI 视频。收费调用关闭。</p><p><a href="/">原工作室 / 登录入口</a></p><div id="message" role="status"></div><section><h2>角色一致性档案</h2><button id="importV23" type="button">从第23版18镜头创建项目</button><form id="character"></form><button id="saveCharacter">保存角色档案</button></section><section><h2>参考素材</h2><p>支持10 MB以内PNG、JPEG、WebP参考图片；上传素材不代表已验证角色一致性。</p><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><button id="saveAsset">上传素材</button><div id="assets"></div></section><section><h2>项目检查与备份</h2><button id="check">检查制作准备</button><a href="/api/tiangong/pilot/backup">下载项目与素材备份</a><pre id="readiness" style="white-space:pre-wrap"></pre></section><h2>镜头工作台</h2><div id="shots"></div><script>
const $=id=>document.getElementById(id);let manifest=null;const fields={character_id:'角色ID',name:'角色名（请按原著填写）',face:'面部',hair:'发型',costume:'服装',left_hand_ring:'左手戒指',waist_token:'腰牌',shoes:'鞋履',right_hand_ring:'右手戒指',left_wrist:'左腕饰物',chest_mark:'胸口印记',signature_prop:'标志道具'};
function say(t){$('message').textContent=t}async function api(path,method='GET',body){const r=await fetch('/api/tiangong'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j}
for(const [key,label] of Object.entries(fields)){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.id=key;i.required=!['right_hand_ring','left_wrist','chest_mark','signature_prop'].includes(key);l.append(i);$('character').append(l)}
async function refresh(){try{manifest=await api('/pilot')}catch(e){if(!e.message.includes('初始化'))throw e;manifest=null}const storage=await api('/storage');say(storage.ephemeral?'当前为临时存储，服务器重启可能丢失素材。请使用持久磁盘后再保存正式素材。':'素材保存于本地数据目录；请定期备份。');if(!manifest)return;const c=manifest.characters[0];for(const key of Object.keys(fields))$(key).value=c[key]||'';$('character_id').disabled=true;$('assets').replaceChildren();for(const a of manifest.assets||[]){const row=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.value=a.id;check.checked=(c.reference_asset_ids||[]).includes(a.id);check.dataset.reference='true';row.append(check,document.createTextNode(a.name));$('assets').append(row)}$('shots').replaceChildren();for(const s of manifest.shots){const section=document.createElement('section'),title=document.createElement('h3'),text=document.createElement('textarea'),use=document.createElement('input'),label=document.createElement('label'),button=document.createElement('button');title.textContent=`镜头 ${s.id} · 5秒 · ${s.status}`;if(s.title){const detail=document.createElement('p');detail.textContent=s.title+' · 旁白：'+s.narration;section.append(detail)};text.value=s.prompt;use.type='checkbox';use.checked=s.character_ids.includes(c.character_id);label.append(use,document.createTextNode('引用当前角色及锁定参考'));button.textContent='保存镜头';button.onclick=()=>act(async()=>{await api('/pilot/shots/'+s.id,'PUT',{prompt:text.value,character_ids:use.checked?[c.character_id]:[]});await refresh()});section.append(title,text,label,button);$('shots').append(section)}}
async function act(fn){try{await fn()}catch(e){say(e.message)}}$('saveCharacter').onclick=()=>act(async()=>{if(!$('character').reportValidity())return;const body=Object.fromEntries(Object.keys(fields).map(k=>[k,$(k).value]));if(manifest)body.reference_asset_ids=Array.from(document.querySelectorAll('[data-reference]:checked')).map(x=>x.value);await api(manifest?'/pilot/characters/'+encodeURIComponent(body.character_id):'/pilot',manifest?'PUT':'POST',body);await refresh()});$('saveAsset').onclick=()=>act(async()=>{const file=$('upload').files[0];if(!file)throw Error('请先选择文件');if(file.size>10*1024*1024)throw Error('文件超过10 MB');const r=await fetch('/api/tiangong/pilot/assets/image?name='+encodeURIComponent(file.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});if(!r.ok){const j=await r.json();throw Error(j.detail)}await refresh()});$('importV23').onclick=()=>act(async()=>{await api('/pilot/from-v23','POST',{});await refresh()});$('check').onclick=()=>act(async()=>{const r=await api('/pilot/readiness');const reasons={unresolved_character_reference:'配角或灯中人影尚未锁定参考',missing_prompt:'缺少镜头描述',missing_character_reference:'角色未绑定参考素材',stale_character_version:'角色已修改，请重新保存镜头'};$('readiness').textContent=(r.planning_ready?'制作规划检查通过（仍需人工核验角色与画质）':'制作规划尚未就绪')+'\n'+r.shot_blockers.map(x=>'镜头 '+x.shot_id+'：'+x.reasons.map(k=>reasons[k]||k).join('、')).join('\n')+(r.asset_issues.length?'\n素材缺失或校验失败：'+r.asset_issues.length+'项':'')});act(refresh);
</script></html>
