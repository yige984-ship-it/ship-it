<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xiuxian AI Studio</title><style>
:root{color-scheme:dark;font-family:system-ui;background:#0b1220;color:#e8edf5}body{max-width:960px;margin:auto;padding:24px 16px}h1{font-size:29px}small,.muted{color:#aabbd1}section{background:#152238;border:1px solid #2b405a;border-radius:16px;padding:20px;margin:16px 0}textarea,input,button,select{box-sizing:border-box;font:inherit;border-radius:9px;padding:12px;border:1px solid #425774}textarea{width:100%;min-height:220px;background:#0b1729;color:white}input{width:110px;background:#0b1729;color:white}button{background:#8de1cd;color:#082820;font-weight:650;cursor:pointer;min-height:48px;margin:8px 4px 8px 0}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}article{border-top:1px solid #35475f;padding:12px 0}a{color:#8de1cd}#notice{white-space:pre-wrap;color:#f7d89b}label{display:block;margin:12px 0}video{width:100%;max-height:600px}</style>
<header><small>修仙创作工作台 · MVP</small><h1>Xiuxian AI Studio</h1><p>从中文小说开始，规划一集 120 秒的国漫。</p></header>
<section><strong>模拟模式 · 不调用收费 API</strong><p class="muted">分镜与角色为本地规则草案。模拟影片是带水印的色卡和静音，不是真实国漫或配音。价格来自示例配置，不是实时报价。</p></section>
<section><label for="style">国风风格</label><select id="style"><option value="xianxia">仙侠国漫</option><option value="ink">中国水墨</option><option value="gufeng">古风工笔</option></select><label for="novel">小说正文（最多 20,000 字）</label><textarea id="novel" maxlength="20000" placeholder="少年修士踏入山门，云海中传来一声剑鸣……"></textarea><label for="budget">预算上限（人民币，最高150元）</label><input id="budget" type="number" min="0.01" max="150" step="0.01" value="150"><p><button id="plan">生成分镜计划</button></p><p id="notice" role="status" aria-live="polite"></p></section>
<section id="result" hidden><h2>制作计划</h2><p id="summary"></p><p id="characters"></p><button id="render">合成模拟 MP4</button><button id="json">下载分镜 JSON</button><div id="download"></div><details id="editor"><summary>编辑角色与分镜</summary><p>总时长须为120秒；修改后旧成片失效，需重新合成。价格按保存时重新计算。</p><div id="fields"></div><button id="save">保存修改并重算预算</button></details><div id="shots"></div></section>
<script>
let project, timer;const $=id=>document.getElementById(id);const say=t=>$('notice').textContent=t;
async function api(path,body,method='POST'){const r=await fetch(path,body===undefined?{}:{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function show(p){project=p;buildEditor(p);localStorage.setItem('xiuxianProject',p.id);$('result').hidden=false;$('summary').textContent=`状态：${p.status} · ${p.duration}秒 · 估算 ¥${p.estimated_cny}（含预留） · 实际API支出 ¥${p.actual_api_cost_cny}。${p.budget_message}`;$('characters').textContent=p.characters.map(c=>`${c.name}：${c.appearance}；${c.source}`).join('\n');$('render').disabled=!p.budget_ok||p.status==='rendering_mock';$('shots').replaceChildren();p.shots.forEach(s=>{let a=document.createElement('article');a.textContent=`镜头 ${s.id} · ${s.duration}秒 · ${s.strategy} · ¥${s.estimated_cny} · ${s.video_task}`;let t=document.createElement('p');t.textContent=s.prompt;a.append(t);$('shots').append(a)});$('download').replaceChildren();if(p.download_url){let v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=p.preview_url||p.download_url;v.setAttribute('aria-label','模拟视频预览');$('download').append(v);let a=document.createElement('a');a.href=p.download_url;a.textContent='下载模拟 MP4（色卡与静音）';$('download').append(a)}if(p.error)say(p.error)}

function field(parent,label,value,key,kind='text'){
 const l=document.createElement('label');l.textContent=label;
 const input=document.createElement(kind==='textarea'?'textarea':kind==='select'?'select':'input');
 input.dataset.key=key;
 if(kind==='select'){for(const [v,t] of value.options){const o=document.createElement('option');o.value=v;o.textContent=t;input.append(o)}input.value=value.selected}
 else{input.value=value;if(kind==='number'){input.type='number';input.step='1'}}
 input.style.width='100%';if(kind==='textarea')input.style.minHeight='80px';l.append(input);parent.append(l);return input;
}
function buildEditor(p){
 const root=$('fields');root.replaceChildren();$('style').value=p.style||'xianxia';$('budget').value=p.budget_cny;
 field(root,'方案风格',{selected:p.style||'xianxia',options:[['xianxia','仙侠国漫'],['ink','中国水墨'],['gufeng','古风工笔']]},'style','select');
 field(root,'预算上限（元）',p.budget_cny,'budget_cny','number');
 for(const c of p.characters){const box=document.createElement('article');box.dataset.character=c.id;root.append(box);field(box,'角色名称',c.name,'name');field(box,'外观',c.appearance,'appearance','textarea');field(box,'一致性要求',c.consistency,'consistency','textarea')}
 for(const shot of p.shots){const box=document.createElement('article');box.dataset.shot=shot.id;const title=document.createElement('strong');title.textContent='镜头 '+shot.id;box.append(title);root.append(box);field(box,'时长（秒）',shot.duration,'duration','number');field(box,'制作策略',{selected:shot.strategy,options:[['keyframe','静态关键帧'],['low_motion','低动作视频']]},'strategy','select');field(box,'旁白',shot.narration,'narration','textarea');field(box,'镜头提示词',shot.prompt,'prompt','textarea')}
 $('save').disabled=p.status==='rendering_mock';
}
$('save').onclick=async()=>{
 const get=(box,key)=>box.querySelector('[data-key="'+key+'"]').value;
 const root=$('fields');
 const payload={revision:project.revision||1,style:get(root,'style'),budget_cny:Number(get(root,'budget_cny')),
 characters:[...root.querySelectorAll('[data-character]')].map(b=>({id:b.dataset.character,name:get(b,'name'),appearance:get(b,'appearance'),consistency:get(b,'consistency')})),
 shots:[...root.querySelectorAll('[data-shot]')].map(b=>({id:Number(b.dataset.shot),duration:Number(get(b,'duration')),strategy:get(b,'strategy'),narration:get(b,'narration'),prompt:get(b,'prompt')}))};
 if(payload.shots.reduce((n,s)=>n+s.duration,0)!==120){say('请将全部镜头总时长调整为120秒。');return}
 $('save').disabled=true;try{show(await api('/api/projects/'+project.id+'/plan',payload,'PUT'));say('方案已保存，预算已重算。重新合成后可预览新版本。')}catch(e){say(e.message)}finally{$('save').disabled=false}
};
$('plan').onclick=async()=>{const b=$('plan');b.disabled=true;try{show(await api('/api/projects',{text:$('novel').value,budget_cny:Number($('budget').value),style:$('style').value}));say('分镜草案已保存，请审阅角色、提示词和预算。')}catch(e){say(e.message)}finally{b.disabled=false}};
$('render').onclick=async()=>{const id=project.id;$('render').disabled=true;$('plan').disabled=true;$('editor').open=false;say('正在合成模拟色卡影片，请稍候。');timer=setInterval(async()=>{try{show(await api('/api/projects/'+id))}catch(e){say(e.message)}},2000);try{show(await api('/api/projects/'+id+'/render',{mode:'mock'}));say(project.status==='completed_mock'?'模拟合成完成；未生成真实视频或配音。':project.error)}catch(e){say(e.message)}finally{clearInterval(timer);$('plan').disabled=false;$('render').disabled=!project.budget_ok}};
$('json').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='storyboard.json';a.click();URL.revokeObjectURL(url)};
const saved=localStorage.getItem('xiuxianProject');if(saved)api('/api/projects/'+encodeURIComponent(saved)).then(show).catch(()=>localStorage.removeItem('xiuxianProject'));
</script></html>
